name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          mkdir -p $(go env GOPATH)/bin
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz" | tar -xz -C $(go env GOPATH)/bin --strip-components=1 golangci-lint-2.14.0-linux-amd64/golangci-lint
          golangci-lint --version

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o bin/herd ./cmd/herd

      - name: CLI smoke test
        run: |
          ./bin/herd help
          ./bin/herd daemon -h
          ./bin/herd kv --help
          ./bin/herd agent --help
          ./bin/herd docs --all > /dev/null
          # Offline negative path: status without a daemon must fail, not hang.
          if ./bin/herd agent status --socket /nonexistent-herd-ci/herd.sock; then
            echo "expected agent status to fail without a daemon"
            exit 1
          fi

      - name: Run test suite
        run: go test -v -race -timeout 15m ./...
