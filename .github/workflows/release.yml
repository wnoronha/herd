name: Build & Release

on:
  push:
    tags:
      - "v*"
      - "beta*"
      - "*beta*"
      - "dev*"
      - "*dev*"
      - "nightly*"
      - "*nightly*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag or name for this release (e.g. dev, v0.1.0-dev)'
        required: false
        type: string
        default: 'dev'
      publish_release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile Cross-Platform Binaries
        run: |
          mkdir -p dist bin/release
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-dev}"
          fi
          TAG=$(echo "$TAG" | tr '/' '-')

          TARGETS=(
            "linux/amd64/herd-linux-amd64"
            "linux/arm64/herd-linux-arm64"
            "darwin/amd64/herd-darwin-amd64"
            "darwin/arm64/herd-darwin-arm64"
            "windows/amd64/herd-windows-amd64.exe"
          )

          for target in "${TARGETS[@]}"; do
            IFS="/" read -r goos goarch output_name <<< "$target"
            echo "==> Building $goos/$goarch ($output_name)..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -ldflags="-s -w" -o "bin/release/$output_name" ./cmd/herd

            # Package into archive
            cd bin/release
            if [ "$goos" = "windows" ]; then
              zip "../../dist/herd-${TAG}-${goos}-${goarch}.zip" "$output_name"
            else
              tar -czf "../../dist/herd-${TAG}-${goos}-${goarch}.tar.gz" "$output_name"
            fi
            cd ../..
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Linux AMD64
        uses: actions/upload-artifact@v6
        with:
          name: herd-linux-amd64
          path: |
            dist/herd-*-linux-amd64.tar.gz
            bin/release/herd-linux-amd64

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v6
        with:
          name: herd-linux-arm64
          path: |
            dist/herd-*-linux-arm64.tar.gz
            bin/release/herd-linux-arm64

      - name: Upload macOS ARM64 (Apple Silicon)
        uses: actions/upload-artifact@v6
        with:
          name: herd-darwin-arm64
          path: |
            dist/herd-*-darwin-arm64.tar.gz
            bin/release/herd-darwin-arm64

      - name: Upload macOS AMD64 (Intel)
        uses: actions/upload-artifact@v6
        with:
          name: herd-darwin-amd64
          path: |
            dist/herd-*-darwin-amd64.tar.gz
            bin/release/herd-darwin-amd64

      - name: Upload Windows AMD64
        uses: actions/upload-artifact@v6
        with:
          name: herd-windows-amd64
          path: |
            dist/herd-*-windows-amd64.zip
            bin/release/herd-windows-amd64.exe

      - name: Upload Checksums
        uses: actions/upload-artifact@v6
        with:
          name: herd-checksums
          path: dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-dev}"
          fi
          TAG=$(echo "$TAG" | tr '/' '-')

          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ (dev|beta|alpha|rc|nightly) ]] || [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "Publishing release for tag: $TAG (Prerelease flag: $PRERELEASE_FLAG)"

          # Ensure the tag exists locally and is pushed if dispatched manually
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release assets..."
            gh release upload "$TAG" ./dist/* ./bin/release/* --clobber
          else
            echo "Creating new release for $TAG..."
            gh release create "$TAG" ./dist/* ./bin/release/* \
              $PRERELEASE_FLAG \
              --title "Herd $TAG" \
              --generate-notes
          fi
