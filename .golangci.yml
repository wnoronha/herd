version: "2"
run:
  tests: true
linters:
  enable:
    - errcheck
    - gocyclo
    - gosec
    - misspell
    - staticcheck
    - errorlint
    - unused
  settings:
    gocyclo:
      min-complexity: 20
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go$
        linters:
          - gosec
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
